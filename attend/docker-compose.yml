services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attend
      POSTGRES_PASSWORD: attend
      POSTGRES_DB: attend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attend -d attend"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://attend:attend@postgres:5432/attend
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - job_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./services/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://attend:attend@postgres:5432/attend
      REDIS_URL: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
    volumes:
      - ./services/worker:/app
      - job_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  job_data:
